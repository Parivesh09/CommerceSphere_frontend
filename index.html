<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var dark;
        if (stored === 'light') dark = false;
        else if (stored === 'dark') dark = true;
        else if (stored === 'system') dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        else dark = true;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <title>CommerceSphere - Enterprise E-Commerce Platform</title>
    <meta name="description" content="Enterprise-grade CommerceSphere Retail Platform" />
  </head>
  <body class="bg-background text-on-background antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
